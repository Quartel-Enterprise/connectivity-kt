name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Apple targets only compile and run on macOS, the other targets (Android included) build there too
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build

  # The Linux tests run only on a Linux host; macOS compiles the Linux targets but skips them
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew linuxX64Test

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Quartel-Enterprise/ktlint-rules/.github/actions/ktlint@1.0.2
